# CoffeeNChill automated build and test pipeline

name: CoffeeNChill CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CoffeeNChill.slnx

      - name: Build solution
        run: dotnet build CoffeeNChill.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test CoffeeNChill.slnx --configuration Release --no-build